<div class="module-container">
    <!-- 第一部分：碱基配对 -->
    <section class="tool-section">
        <h2 data-i18n="pairingTitle">Base Pairing</h2>
        
        <div class="input-group">
            <label for="pairing-mode" data-i18n="pairingModeLabel">Select Pairing Mode:</label>
            <select id="pairing-mode">
                <option value="dna-dna" data-i18n="optDnaDna">DNA -- DNA</option>
                <option value="dna-rna" data-i18n="optDnaRna">DNA -- RNA</option>
                <option value="rna-rna" data-i18n="optRnaRna">RNA -- RNA</option>
            </select>
        </div>

        <div class="input-group">
            <label for="pairing-input" data-i18n="inputSequenceLabel">Input Sequence:</label>
            <textarea id="pairing-input"></textarea>
        </div>

        <button id="btn-pair" class="btn" data-i18n="btnRunPairing">Pair</button>

        <div class="output-group">
            <h3 data-i18n="resultLabel">Result:</h3>
            <div id="pairing-result" class="result-box"></div>
        </div>
    </section>

    <hr>

    <!-- 第二部分：寻找蛋白质（密码子翻译） -->
    <section class="tool-section">
        <h2 data-i18n="translationTitle">Find Protein</h2>

        <div class="input-group">
            <label for="source-type" data-i18n="sourceTypeLabel">Select Source Type:</label>
            <select id="source-type">
                <option value="genomic-dna" data-i18n="optGenomicDna">Genomic DNA</option>
                <option value="pre-mrna" data-i18n="optPreMrna">pre-mRNA</option>
                <option value="mature-mrna" data-i18n="optMatureMrna">Mature mRNA</option>
            </select>
        </div>

        <div class="input-group">
            <label for="translation-input" data-i18n="inputSequenceLabel">Input Sequence:</label>
            <textarea id="translation-input"></textarea>
        </div>

        <button id="btn-translate" class="btn btn-primary" data-i18n="btnRunTranslation">Translate</button>

        <div class="output-group">
            <h3 data-i18n="resultLabel">Result:</h3>
            <div id="translation-result" class="result-box"></div>
        </div>
    </section>
</div>
