<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab Tools Website</title>
    <!-- 引入样式文件 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1 data-i18n="appTitle">Lab Tools</h1>
        <!-- 语言切换下拉框 -->
        <div class="lang-selector">
            <select id="lang-select">
                <option value="en">EN</option>
                <option value="de">DE</option>
            </select>
        </div>
        <!-- 选项卡导航区域 -->
        <nav class="tab-nav">
            <button class="tab-btn active" data-tab="pairing" data-i18n="tabPairing">Base Pairing</button>
            <button class="tab-btn" data-tab="unit" data-i18n="tabUnit">Unit Conversion</button>
        </nav>
    </header>

    <!-- 挂载容器：modules/pairing.html 会被 fetch 塞进这里 -->
    <main id="app-container"></main>

    <!-- 统一入口脚本，加上 type="module" -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
